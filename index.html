<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="FERRAIZEN — генеральный подряд. Сайт скоро.">
<style>*{box-sizing:border-box}body{margin:0}</style>
<title>FERRAIZEN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Layout: full-bleed graphite stage; a point-cloud building assembles on the right while the message sits on a ground line at ±0.000 */
:root{
  color-scheme:dark;
  --bg:#1C1C1A; --bg-2:#262624; --ink:#DAD6CF; --muted:#8F8B85; --line:#55524E;
  --corten:#C0612F; --corten-hi:#D9946A;
  --f-sans:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-ar:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);overflow-x:hidden}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block}
.noise{position:fixed;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:screen}
.veil{position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,var(--bg) 0%,rgba(28,28,26,.82) 34%,rgba(28,28,26,0) 62%)}
.wrap{position:relative;min-height:100%;display:flex;flex-direction:column;padding-inline:clamp(16px,5vw,72px);padding-block:clamp(20px,4vh,40px) 0}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.logo{width:clamp(200px,24vw,300px);height:auto;overflow:visible}
.logo .lt{fill:var(--ink);animation:lt .9s cubic-bezier(.2,.7,.2,1) calc(.15s + var(--i)*.07s) both}
.logo .gl{fill:var(--line);transform-origin:0 0;animation:gl 1.1s cubic-bezier(.7,0,.2,1) .1s both}
.logo .col{fill:var(--corten);transform-box:fill-box;transform-origin:50% 100%;animation:col 1.2s cubic-bezier(.2,.8,.2,1) 1s both}
.logo .desc{fill:var(--muted);font:500 9.5px var(--f-sans);letter-spacing:4.5px;animation:fade .8s 1.6s both}
@keyframes lt{from{opacity:.12;transform:translateY(6px)}}
@keyframes gl{from{transform:scaleX(0)}}
@keyframes col{from{transform:scaleY(0)}}
@keyframes fade{from{opacity:.1}}
.lang{display:flex;border:1px solid var(--line)}
.lang button{all:unset;cursor:pointer;font:500 12px var(--f-mono);letter-spacing:1px;color:var(--muted);padding:8px 12px}
.lang button[aria-pressed="true"]{color:var(--bg);background:var(--ink)}
.lang button:focus-visible{outline:2px solid var(--corten);outline-offset:2px}
main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:620px;padding-block:6vh;gap:28px}
.eyebrow{font:500 11px/16px var(--f-mono);letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px}
.eyebrow b{color:var(--corten);font-weight:500}
.dot{width:7px;height:7px;background:var(--corten);border-radius:9999px;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
h1{margin:0;font:300 clamp(38px,6.2vw,78px)/1.02 var(--f-sans);letter-spacing:-.02em;text-wrap:balance}
h1 .w{display:inline-block;animation:lt 1s cubic-bezier(.2,.7,.2,1) calc(.6s + var(--i)*.09s) both}
h1 em{font-style:normal;color:var(--corten)}
.sub{margin:0;font:300 clamp(16px,1.6vw,19px)/1.55 var(--f-sans);color:var(--muted);max-width:52ch;animation:fade 1s 1.3s both}
.term{font:400 13px/22px var(--f-mono);color:var(--muted);min-height:88px;border-left:4px solid var(--corten);padding-left:16px;animation:fade 1s 1.6s both}
.term .ln{white-space:pre;overflow:hidden;text-overflow:ellipsis}
.term .ok{color:var(--corten-hi)}
.term .cur{display:inline-block;width:8px;height:14px;background:var(--ink);vertical-align:-2px;animation:pulse 1s steps(1) infinite}
.contact{display:flex;align-items:center;gap:12px;flex-wrap:wrap;animation:fade 1s 1.9s both}
.contact span{font:400 14px var(--f-sans);color:var(--muted)}
.mail{font:500 15px var(--f-mono);color:var(--ink);user-select:all}
.copy{all:unset;cursor:pointer;font:500 12px var(--f-mono);letter-spacing:1px;color:var(--bg);background:var(--corten);padding:9px 14px}
.copy:hover{background:var(--corten-hi)}
.copy:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.scan{position:fixed;right:clamp(16px,5vw,72px);top:clamp(96px,16vh,150px);text-align:right;font:500 11px/18px var(--f-mono);letter-spacing:1.5px;color:var(--muted);pointer-events:none}
.scan b{display:block;font:400 28px/34px var(--f-mono);letter-spacing:0;color:var(--ink);font-variant-numeric:tabular-nums}
footer{position:relative;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:14px 18px;font:400 11px/16px var(--f-mono);letter-spacing:1px;color:var(--muted)}
footer .z{position:absolute;top:-1px;left:0;width:4px;height:22px;transform:translateY(-100%);background:var(--corten)}
[dir="rtl"] h1,[dir="rtl"] .sub{font-family:var(--f-ar)}
[dir="rtl"] h1{letter-spacing:0;line-height:1.25}
[dir="rtl"] .term{border-left:0;border-right:4px solid var(--corten);padding-left:0;padding-right:16px}
@media (max-width:820px){
  .veil{background:linear-gradient(180deg,rgba(28,28,26,0) 0%,rgba(28,28,26,.75) 38%,var(--bg) 62%)}
  main{justify-content:flex-end;padding-top:38vh}
  .scan{top:auto;bottom:auto;top:110px}
  .scan b{font-size:20px;line-height:26px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head><body>

<canvas id="stage" aria-hidden="true"></canvas>
<svg class="noise" aria-hidden="true"><filter id="nz"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#nz)"/></svg>
<div class="veil" aria-hidden="true"></div>
<div class="scan" aria-hidden="true"><span id="scanLbl">СКАН · ОТМ.</span><b id="scanVal">+0.000</b><span id="scanSub">ЦИФРОВОЙ ДВОЙНИК</span></div>

<div class="wrap" id="wrap">
  <header>
    <svg class="logo" viewBox="-16 -30 431 98" role="img" aria-label="FERRAIZEN — General Contractor"><g class="lt" style="--i:0"><rect x="0.0" y="0.0" width="4.5" height="34.0"/><rect x="0.0" y="0.0" width="34.0" height="4.5"/><rect x="0.0" y="14.8" width="27.2" height="4.5"/></g><g class="lt" style="--i:1"><rect x="49.0" y="0.0" width="4.5" height="34.0"/><rect x="49.0" y="0.0" width="34.0" height="4.5"/><rect x="49.0" y="14.8" width="28.9" height="4.5"/><rect x="49.0" y="29.5" width="34.0" height="4.5"/></g><g class="lt" style="--i:2"><rect x="98.0" y="0.0" width="4.5" height="34.0"/><rect x="98.0" y="0.0" width="34.0" height="4.5"/><rect x="127.5" y="0.0" width="4.5" height="19.5"/><rect x="98.0" y="15.0" width="34.0" height="4.5"/><polygon points="112.8,19.5 117.2,19.5 132.0,34.0 127.5,34.0"/></g><g class="lt" style="--i:3"><rect x="147.0" y="0.0" width="4.5" height="34.0"/><rect x="147.0" y="0.0" width="34.0" height="4.5"/><rect x="176.5" y="0.0" width="4.5" height="19.5"/><rect x="147.0" y="15.0" width="34.0" height="4.5"/><polygon points="161.8,19.5 166.2,19.5 181.0,34.0 176.5,34.0"/></g><g class="lt" style="--i:4"><rect x="196.0" y="0.0" width="4.5" height="34.0"/><rect x="225.5" y="0.0" width="4.5" height="34.0"/><rect x="196.0" y="0.0" width="34.0" height="4.5"/><rect x="196.0" y="16.3" width="34.0" height="4.5"/></g><g class="lt" style="--i:5"><rect x="267.0" y="0.0" width="34.0" height="4.5"/><rect x="267.0" y="29.5" width="34.0" height="4.5"/><polygon points="295.8,4.5 301.0,4.5 272.2,29.5 267.0,29.5"/></g><g class="lt" style="--i:6"><rect x="316.0" y="0.0" width="4.5" height="34.0"/><rect x="316.0" y="0.0" width="34.0" height="4.5"/><rect x="316.0" y="14.8" width="28.9" height="4.5"/><rect x="316.0" y="29.5" width="34.0" height="4.5"/></g><g class="lt" style="--i:7"><rect x="365.0" y="0.0" width="4.5" height="34.0"/><rect x="394.5" y="0.0" width="4.5" height="34.0"/><polygon points="365.0,0.0 370.2,0.0 399.0,34.0 393.8,34.0"/></g><rect class="gl" x="-14" y="46" width="427" height="1.2"/><polygon class="col" points="245,-18 252,-26 252,46 245,46"/><text class="desc" x="413" y="64" text-anchor="end">GENERAL CONTRACTOR</text></svg>
    <div class="lang" role="group" aria-label="Language">
      <button id="l-ru" data-l="ru" aria-pressed="true">RU</button>
      <button id="l-en" data-l="en" aria-pressed="false">EN</button>
      <button id="l-ar" data-l="ar" aria-pressed="false">AR</button>
    </div>
  </header>
  <main id="msg">
    <div class="eyebrow"><span class="dot"></span><span data-t="eyebrow"></span></div>
    <h1 id="title"></h1>
    <p class="sub" data-t="sub"></p>
    <div class="term" id="term" aria-live="polite"></div>
    <div class="contact"><span data-t="contact"></span><span class="mail" id="mail">info@ferraizen.com</span><button class="copy" id="copy" data-t="copy"></button></div>
  </main>
  <footer><i class="z"></i><span data-t="foot1"></span><span>© 2026 FERRAIZEN</span></footer>
</div>

<script>
const T={
 ru:{eyebrow:'<b>ferraizen.com</b> · запуск скоро',title:['Здесь','мы','<em>перестраиваемся</em>','для','Вас.'],
  sub:'Генеральный подряд, в котором бетон, сталь и данные работают как одна конструкция.',
  contact:'Профиль компании по запросу:',copy:'КОПИРОВАТЬ',copied:'СКОПИРОВАНО',foot1:'ОТМ. ±0.000 · ГЕНЕРАЛЬНЫЙ ПОДРЯД',
  scan:'СКАН · ОТМ.',scanSub:'ЦИФРОВОЙ ДВОЙНИК',
  term:[['BIM-модель объекта','синхронизирована'],['Цифровой двойник','онлайн'],['AI-контроль графика','активен'],['Бетон · сталь · данные','одна система']]},
 en:{eyebrow:'<b>ferraizen.com</b> · launching soon',title:["We're",'<em>rebuilding</em>','here','—','for','you.'],
  sub:'General contracting where concrete, steel and data work as one structure.',
  contact:'Company profile on request:',copy:'COPY',copied:'COPIED',foot1:'EL. ±0.000 · GENERAL CONTRACTOR',
  scan:'SCAN · EL.',scanSub:'DIGITAL TWIN',
  term:[['BIM model','synced'],['Digital twin','online'],['AI schedule control','active'],['Concrete · steel · data','one system']]},
 ar:{eyebrow:'<b>ferraizen.com</b> · الإطلاق قريباً',title:['هنا','<em>نُعيد</em>','البناء','من','أجلكم.'],
  sub:'مقاولات عامة تعمل فيها الخرسانة والفولاذ والبيانات كهيكلٍ واحد.',
  contact:'ملف الشركة عند الطلب:',copy:'نسخ',copied:'تم النسخ',foot1:'المنسوب ±0.000 · مقاولات عامة',
  scan:'مسح · المنسوب',scanSub:'التوأم الرقمي',
  term:[['نموذج BIM','متزامن'],['التوأم الرقمي','متصل'],['التحكم الذكي بالجدول','نشط'],['خرسانة · فولاذ · بيانات','نظام واحد']]}
};
let lang='ru';
try{const s=localStorage.getItem('fz-lang');if(T[s])lang=s}catch(e){}
const $=id=>document.getElementById(id);
function setLang(l){
  lang=l;const d=T[l];
  try{localStorage.setItem('fz-lang',l)}catch(e){}
  document.documentElement.lang=l;
  $('msg').dir=l==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-t]').forEach(el=>{el.innerHTML=d[el.dataset.t]});
  $('title').innerHTML=d.title.map((w,i)=>`<span class="w" style="--i:${i}">${w}</span>`).join(' ');
  $('scanLbl').textContent=d.scan;$('scanSub').textContent=d.scanSub;
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===l));
  termReset();
}
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
$('copy').onclick=()=>{
  const done=()=>{$('copy').textContent=T[lang].copied;setTimeout(()=>$('copy').textContent=T[lang].copy,1600)};
  const sel=()=>{const r=document.createRange();r.selectNodeContents($('mail'));const s=getSelection();s.removeAllRanges();s.addRange(r)};
  try{navigator.clipboard.writeText('info@ferraizen.com').then(done,sel)}catch(e){sel()}
};

/* terminal typewriter */
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let tTimer=null;
function lineHTML(a,b,n){const dots=' '+'.'.repeat(Math.max(3,26-a.length))+' ';const full=a+dots;
  if(n<=full.length)return '› '+full.slice(0,n);return '› '+full+'<span class="ok">'+b.slice(0,n-full.length)+'</span>'}
function termReset(){
  clearTimeout(tTimer);const lines=T[lang].term,el=$('term');
  if(RM){el.innerHTML=lines.map(([a,b])=>`<div class="ln">${lineHTML(a,b,999)}</div>`).join('');return}
  let li=0,ci=0,shown=[];
  const tick=()=>{
    const [a,b]=lines[li%lines.length],len=a.length+Math.max(3,26-a.length)+2+b.length;
    ci++;
    const cur=`<div class="ln">${lineHTML(a,b,ci)}<span class="cur"></span></div>`;
    el.innerHTML=shown.slice(-3).map(s=>`<div class="ln">${s}</div>`).join('')+cur;
    if(ci>=len){shown.push(lineHTML(a,b,999));li++;ci=0;tTimer=setTimeout(tick,li%lines.length===0?2600:700)}
    else tTimer=setTimeout(tick,ci<a.length?38:16);
  };
  tTimer=setTimeout(tick,1800);
}

/* point-cloud building */
const cv=$('stage'),cx2=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;cx2.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
const P=[],E=[];let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
function edge(a,b,step=.42,line=true){
  const L=Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]),n=Math.max(1,Math.round(L/step));
  for(let i=0;i<=n;i++){const t=i/n,p=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
    const r=9+rnd()*9,th=rnd()*6.283,ph=rnd()*3.14;
    P.push({t:p,s:[Math.cos(th)*Math.sin(ph)*r,Math.sin(th)*Math.sin(ph)*r,rnd()*18],d:rnd()*.5})}
  if(line)E.push([a,b]);
}
function box(x0,x1,y0,y1,z0,z1,grid){
  for(let z=z0;z<=z1;z++){const c=[[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
    for(let i=0;i<4;i++)edge([...c[i],z],[...c[(i+1)%4],z],.42,z===z0||z===z1||z%2===0)}
  for(let x=x0;x<=x1;x+=grid)for(const y of [y0,y1])edge([x,y,z0],[x,y,z1],.5,x===x0||x===x1);
  for(let y=y0+grid;y<y1;y+=grid)for(const x of [x0,x1])edge([x,y,z0],[x,y,z1],.5,false);
}
box(-7,7,-4,4,0,2,2);   // podium
box(-3,4,-3,3,2,13,1);  // tower
box(-3,0,-3,0,13,14,1); // roof plant
const ground=[];for(let x=-16;x<=16;x+=2)for(let y=-12;y<=12;y+=2)ground.push([x,y,0]);
const MAST={x:4,y:-3,top:17.5};
let mx=0,my=0,tmx=0,tmy=0;
addEventListener('pointermove',e=>{tmx=e.clientX/W-.5;tmy=e.clientY/H-.5});
const ease=t=>1-Math.pow(1-Math.min(1,Math.max(0,t)),3);
const t0=performance.now();
function frame(now){
  const t=RM?30:(now-t0)/1000;
  mx+=(tmx-mx)*.04;my+=(tmy-my)*.04;
  cx2.clearRect(0,0,W,H);
  const narrow=W<820,s=Math.min(W*(narrow?.042:.026),H*.034);
  const cx=narrow?W*.5:W*.68,cy=narrow?H*.40:H*.80;
  const a=-.65+t*.045+mx*.6,ca=Math.cos(a),sa=Math.sin(a),tilt=.42+my*.12;
  const proj=(x,y,z)=>[cx+(x*ca-y*sa)*s,cy+(x*sa+y*ca)*s*tilt-z*s*1.02,(x*sa+y*ca)];
  const build=(t-.6)/4.6*14;           // floors completed
  const done=Math.min(1,Math.max(0,(t-5.4)/1.2));
  const scanZ=done<1?Math.min(build,14):7+6.6*Math.sin((t-6.6)*.55-1.57)+0.4;
  // ground dots
  cx2.fillStyle='#55524E';
  for(const g of ground){const p=proj(...g);cx2.globalAlpha=.35+.3*Math.min(1,t/1.5);cx2.fillRect(p[0]-1,p[1]-1,2,2)}
  // edges
  cx2.lineWidth=1;
  for(const [A,B] of E){const z=Math.max(A[2],B[2]),k=ease((build-z)/1.5);if(k<=0)continue;
    const p=proj(...A),q=proj(...B);cx2.globalAlpha=.22*k;cx2.strokeStyle='#DAD6CF';
    cx2.beginPath();cx2.moveTo(p[0],p[1]);cx2.lineTo(p[0]+(q[0]-p[0])*k,p[1]+(q[1]-p[1])*k);cx2.stroke()}
  // points
  for(const o of P){const k=ease((build-o.t[2]-o.d)/1.6);
    const x=o.s[0]+(o.t[0]-o.s[0])*k,y=o.s[1]+(o.t[1]-o.s[1])*k,z=o.s[2]+(o.t[2]-o.s[2])*k;
    const p=proj(x,y,z),dz=Math.abs(o.t[2]-scanZ),hot=k>.98&&dz<.45;
    const depth=.45+.55*Math.min(1,Math.max(0,(p[2]+8)/16));
    cx2.globalAlpha=(k<=0?.18:(.25+.75*k))*depth*(hot?1:.8);
    cx2.fillStyle=hot?'#D9946A':'#DAD6CF';const r=hot?1.9:1.2;
    cx2.fillRect(p[0]-r/2,p[1]-r/2,r,r)}
  // scan plane
  const hw=8.5,hd=5.5,c=[[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]].map(v=>proj(v[0]+.5,v[1],scanZ));
  cx2.globalAlpha=.10;cx2.fillStyle='#C0612F';cx2.beginPath();c.forEach((p,i)=>i?cx2.lineTo(p[0],p[1]):cx2.moveTo(p[0],p[1]));cx2.closePath();cx2.fill();
  cx2.globalAlpha=.75;cx2.strokeStyle='#C0612F';cx2.stroke();
  // corten mast (logo "I") rises after build
  if(done>0){const m=ease(done),b0=proj(MAST.x,MAST.y,0),top=proj(MAST.x,MAST.y,MAST.top*m),wpx=Math.max(4,s*.32);
    cx2.globalAlpha=1;cx2.fillStyle='#C0612F';cx2.beginPath();
    cx2.moveTo(b0[0],b0[1]);cx2.lineTo(b0[0]+wpx,b0[1]);cx2.lineTo(top[0]+wpx,top[1]-wpx*.9*m);cx2.lineTo(top[0],top[1]);cx2.closePath();cx2.fill()}
  cx2.globalAlpha=1;
  $('scanVal').textContent='+'+(scanZ*3.3).toFixed(3);
  if(!RM)requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
setLang(lang);
</script>
</body></html>
